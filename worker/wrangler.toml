name = "spotify-lyrics-worker"
main = "worker.js"
compatibility_date = "2024-01-01"

[observability]
enabled = false

# Stored furigana readings (see "Furigana" in the README).  The namespace was
# created with
#   wrangler kv namespace create FURIGANA_CACHE
# and this is the id it printed.  A fork needs its own namespace and id; with
# this block removed, /furigana still works, reading every song each time.
[[kv_namespaces]]
binding = "FURIGANA_CACHE"
id = "b89f08bf01b54248996390f20f0b7edf"
